<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Admin STRINGHUB</title>
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<h1>ADMIN STRINGHUB</h1>

<hr>

<h2>Quản lý sản phẩm</h2>

<input id="pname" placeholder="Tên sản phẩm">
<input id="pprice" type="number" placeholder="Giá">
<input id="pquantity" type="number" placeholder="Số lượng">
<button onclick="addProduct()">➕ Thêm</button>

<table border="1" width="100%">
<thead>
<tr>
<th>Tên</th>
<th>Giá</th>
<th>Số lượng</th>
<th>Hành động</th>
</tr>
</thead>
<tbody id="productTable"></tbody>
</table>

<hr>


<h2>Quản lý tài khoản</h2>

<input id="uname" placeholder="Tên đăng nhập">
<input id="upass" placeholder="Mật khẩu">
<select id="urole">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
<button onclick="addUser()">➕ Thêm user</button>

<table border ="1" width="100%">
<thead>
<tr>
<th>Username</th>
<th>Role</th>
<th>Hành động</th>
</tr>
</thead>
<tbody id="userTable"></tbody>
</table>

<script src="/js/admin.js"></script>
</body>
</html>
